<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gestão de Atendentes | Alva</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="navbar">
    <a href="admin.html" class="logo">
      <span class="material-symbols-outlined">local_laundry_service</span> Lavanderia <span>Alva</span>
      <span class="admin-badge">Admin</span>
    </a>
    <ul class="nav-links">
      <li><a href="admin.html">Catálogo e Preços</a></li>
      <li><a href="kanban.html">Kanban</a></li>
      <li><a href="atendentes.html" class="active">Atendentes</a></li>
      <li><button type="button" class="btn btn-secondary btn-nav" onclick="sessionStorage.removeItem('alva_admin_token'); window.location.href='admin.html';">Sair</button></li>
    </ul>
  </header>

  <main class="admin-wrapper">
    <div class="card" style="max-width: 800px; margin: 0 auto;">
      <h2>Gestão de Atendentes</h2>
      <p>Cadastre e gerencie os funcionários que terão acesso ao sistema.</p>

      <form id="formAtendente" style="display: grid; gap: 10px; margin-bottom: 20px;">
        <input type="text" id="atNome" placeholder="Nome Completo" required>
        <input type="email" id="atEmail" placeholder="E-mail (usado para login)" required>
        <input type="password" id="atSenha" placeholder="Senha" required>
        <select id="atPerfil" required>
          <option value="ATENDENTE">Atendente</option>
          <option value="ADMIN">Administrador</option>
        </select>
        <button type="submit" class="btn btn-primary">Cadastrar Atendente</button>
      </form>

      <table class="admin-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Perfil</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="listaAtendentes"></tbody>
      </table>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/atendentes.js"></script>
</body>
</html>
