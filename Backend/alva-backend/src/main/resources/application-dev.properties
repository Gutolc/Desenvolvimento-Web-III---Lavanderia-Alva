# =====================================================================
# Perfil DEV - ativado com spring.profiles.active=dev (padrão local)
# =====================================================================

# Em dev, facilita a vida: loga SQL e permite criar/atualizar schema
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Seeder de dados de exemplo (PedidoSeeder) só roda nos perfis dev/default
logging.level.com.alva.backend=DEBUG

# Libera CORS mais aberto em dev para facilitar testes locais
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
