spring.application.name=alva
server.servlet.context-path=/

spring.datasource.url=jdbc:mysql://localhost:3306/Alva?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Joao102030.}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

alva.jwt.secret=${JWT_SECRET:alva-secret-key-change-me-please-alva-secret-key}
alva.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

alva.cliente.jwt.secret=${CLIENTE_JWT_SECRET:alva-cliente-secret-key-change-me-please}
alva.cliente.jwt.expiration-ms=${CLIENTE_JWT_EXPIRATION_MS:2592000000}

# Canal de envio do código de acesso: "console" (log local, para dev/teste
# sem credenciais reais) ou "whatsapp" (WhatsApp Cloud API, produção)
alva.otp.canal=${OTP_CANAL:console}
alva.otp.expiracao-minutos=${OTP_EXPIRACAO_MINUTOS:5}
alva.otp.max-tentativas=${OTP_MAX_TENTATIVAS:5}

# Credenciais da WhatsApp Cloud API (Meta) — necessárias só quando
# alva.otp.canal=whatsapp
alva.whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com/v20.0}
alva.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
alva.whatsapp.token=${WHATSAPP_TOKEN:}

