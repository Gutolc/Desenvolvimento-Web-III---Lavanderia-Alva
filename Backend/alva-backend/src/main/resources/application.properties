# =====================================================================
# Configuração base da aplicação ALVA Backend
# Todas as credenciais sensíveis vêm de VARIÁVEIS DE AMBIENTE.
# Nunca commitar valores reais de senha/usuário direto neste arquivo.
# Use o arquivo ".env.example" como referência do que precisa ser
# exportado no ambiente (ou configurado no application-local.properties,
# que é ignorado pelo Git).
# =====================================================================

spring.application.name=alva-backend

# Perfil ativo (dev, prod, test). Pode ser sobrescrito via:
#   -Dspring.profiles.active=prod
#   ou variável de ambiente SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------------------------------------------------------------------
# Banco de dados (valores lidos de variáveis de ambiente)
# Fallback local (H2/Postgres de dev) caso a variável não esteja definida
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alva_db}
spring.datasource.username=${DB_USER:alva_user}
spring.datasource.password=${DB_PASSWORD:alva_password}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------
# JWT / Autenticação (lido de variável de ambiente, nunca hardcoded)
# ---------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:change-this-secret-in-env-file}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------------
# CORS - domínio(s) autorizados a consumir a API
# ---------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# Webhook WhatsApp (Meta) - definir via variavel de ambiente
alva.meta.verify-token=${META_VERIFY_TOKEN:}
alva.meta.app-secret=${META_APP_SECRET:}
