# =====================================================================
# Perfil PROD - ativado com SPRING_PROFILES_ACTIVE=prod
# Todas as credenciais DEVEM vir de variáveis de ambiente reais
# configuradas no servidor/plataforma de deploy (Railway, Render, EC2,
# Docker secrets, etc.). Nada aqui tem valor sensível hardcoded.
# =====================================================================

# Em produção, nunca expor SQL nos logs nem permitir alteração automática
# de schema sem controle (idealmente usar "validate" + migrations/Flyway)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

logging.level.com.alva.backend=INFO
logging.level.org.springframework=WARN

# CORS restrito ao domínio real do frontend em produção
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://app.alva.com.br}
