spring.application.name=alva
server.servlet.context-path=/

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Alva;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Joao102030.}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

alva.jwt.secret=${JWT_SECRET:alva-secret-key-change-me-please-alva-secret-key}
alva.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

