spring.application.name=alva
server.servlet.context-path=/

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/alva?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

alva.jwt.secret=${JWT_SECRET:alva-secret-key-change-me-please-alva-secret-key}
alva.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

alva.admin.email=${ADMIN_EMAIL:admin@alva.com.br}
alva.admin.senha=${ADMIN_SENHA:Alva@2026}
